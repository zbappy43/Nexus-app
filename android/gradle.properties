org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# flutter_inappwebview_android 1.1.x still references
# getDefaultProguardFile('proguard-android.txt') in its own build script, which
# AGP 9 rejects by default. This opt-out only affects that library's build
# script; the app itself uses proguard-android-optimize.txt.
android.r8.proguardAndroidTxt.disallowed=false

# ------------------------------------------------------------------------------
# Nexus Consumers configuration
# ------------------------------------------------------------------------------
# Website host used for verified App Links (https deep links).
# Bare domain (no www); the manifest also registers www.<host>.
nexus.webHost=nexusglobalplc.com
# Custom deep-link scheme (myapp://...). Must match DEEP_LINK_SCHEME.
nexus.deepLinkScheme=myapp
