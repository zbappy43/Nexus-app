name: consumers
description: "Nexus Consumers Limited – official Android app."
publish_to: 'none'

# versionName+versionCode. Increase the build number (+N) for every Play upload.
version: 1.0.0+2

environment:
  sdk: ^3.14.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  flutter_inappwebview: ^6.1.5
  provider: ^6.1.5+1
  connectivity_plus: ^7.3.2
  permission_handler: ^13.0.2
  flutter_downloader: ^1.12.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.3
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  mobile_scanner: ^7.5.0
  syncfusion_flutter_pdfviewer: ^35.2.12
  in_app_update: ^5.0.0
  flutter_secure_storage: ^11.2.0
  onesignal_flutter: ^5.8.0
  shared_preferences: ^2.5.6
  crypto: ^3.0.8
  open_filex: ^5.0.0
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/js/

# ------------------------------------------------------------------------------
# Launcher icons: dart run flutter_launcher_icons
# (round icons: python3 tools/generate_brand_assets.py --round-only)
# ------------------------------------------------------------------------------
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"
  min_sdk_android: 24

# ------------------------------------------------------------------------------
# Native splash (shown before Flutter starts): dart run flutter_native_splash:create
# ------------------------------------------------------------------------------
flutter_native_splash:
  color: "#0A7C3E"
  image: assets/images/splash_logo.png
  color_dark: "#065A2C"
  image_dark: assets/images/splash_logo.png
  android_12:
    image: assets/images/splash_logo_android12.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/images/splash_logo_android12.png
    icon_background_color_dark: "#FFFFFF"
  android: true
  ios: false
  web: false
  fullscreen: false
